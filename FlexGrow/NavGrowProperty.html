<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        nav{
            /* border: 2px solid red; */
            display: flex;
            padding: 10px;
            gap: 8px;
            align-items: center;
            background-color: #232f3e;
            color: white;
        }
        nav a{
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
        .logo{
            /* border: 2px solid blue; */
            font-size: 20px;
            font-weight: bold;
            padding: 6px;
        }
        .search{
            border: 2px solid red;
            flex-grow: 1;
            border-radius: 10px;
        }
        .search input{
            width: 99%;
            padding: 6px;
            border-radius: 7px;
            border: none;
            outline: none;
        }
        button{
            background-color: orangered;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
        }
        a:hover{
            color: yellow;
        }
        button:hover{
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <nav>
        <div class="logo">Logo</div>
        <a href="">Home</a>
        <a href="">Offers</a>

        <div class="search">
            <input type="text" placeholder="Search Products">
        </div>

        <button>Cart</button>
    </nav>

</body>
</html>
