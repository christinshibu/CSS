<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        .background {
            background-color: rgb(210, 255, 255);
            margin: auto;
            width: 600px;
            height: 450px;
            padding-top: 50px;
            box-sizing: border-box;
        }

        .outercard {
            /* border: 1px solid black; */
            width: 300px;
            margin: auto;
            background-color: white;
            text-align: center;
            box-shadow: 3px 4px 6px rgb(118, 118, 118);
            border-radius: 7px;
            font-family: Arial, Helvetica, sans-serif;
        }

        img {
            height: 100px;
            width: 100px;
            border-radius: 50%;
            border: 2px solid black;
        }

        .innercard {
            padding: 25px 25px;
            box-sizing: border-box;
        }

        .follow {
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            background-color: rgb(0, 166, 255);
            color: white;
            font-size: 15px;
        }

        .message {
            border-radius: 4px;
            border: 2px solid rgb(0, 166, 255);
            padding: 10px 20px;
            background-color: white;
            color: rgb(0, 166, 255);
            font-size: 15px;
        }

        .loc {
            font-size: 14.5px;
        }
    </style>
</head>

<body>
    <div class="background">
        <div class="outercard">
            <div class="innercard">
                <img src="./profilepic.png" alt="">
                <h2>Your Name</h2>
                <p>Web Developer</p>
                <p class="loc">Location: City, Country</p>
                <button class="follow">Follow</button>&nbsp;&nbsp;
                <button class="message">Message</button>

            </div>
        </div>
    </div>
</body>

</html>
