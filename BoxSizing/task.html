<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
    <style>
        .outer {
            /* border: 1px solid grey; */
            width: 500px;
            box-shadow: 2px 3px 20px rgb(214, 214, 214);
            margin: auto;
            margin-top: 50px;
            border-radius: 2px;

        }

        img {
            width: 100%;
            height: 250px;
            border-radius: 2px;

        }

        .inner {
            padding: 15px 35px;
        }

        h1 {
            font-size: 30px;
            text-shadow: 0px 2px 15px rgb(185, 185, 185);

        }

        p {
            color: rgb(170, 170, 170);
            font-size: 15px;
        }

        button {
            background-color: rgb(109, 255, 109);
            border: none;
            padding: 12px 30px;
            color: white;
            border-radius: 2px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="outer">
        <img src="./Apple.jpg" alt="">
        <div class="inner">
            <h1>Is Apple a Design Company?</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Consectetur dicta magni velit enim quaerat atque
                provident totam. Alias, dolorum magni.
            </p>
            <button>Read More</button>
        </div>
    </div>
</body>

</html>
