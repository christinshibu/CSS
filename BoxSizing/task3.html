<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        .outer {
            /* border: 2px solid black; */
            width: 450px;
            text-align: center;
            border-radius: 12px;
            overflow: hidden;
            margin: auto;
            box-shadow: 2px 3px 6px grey;
        }

        .outer>img {
            width: 100%;
            height: 200px;

        }

        h3 {
            color: grey;
            font-weight: lighter;
            line-height: 8px;
        }

        p {
            font-size: 18px;
            padding: 8px 28px;
            box-sizing: border-box;
        }

        .profile {
            border: 5px solid grey;
            height: 140px;
            width: 140px;
            border-radius: 50%;
            overflow: hidden;
            margin-left: 150px;
            margin-top: -75px;
        }

        .profile>img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div class="outer">
        <img src="./ProfileBackground.png" alt="">
        <div class="profile">
            <img src="./Profile.jpg" alt="">
        </div>
        <h1>Aurora Chen</h1>
        <h3>@auroracreates</h3>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Repellendus, sapiente consectetur accusantium quo
            eligendi facilis iusto fuga provident.</p>
    </div>
</body>

</html>
