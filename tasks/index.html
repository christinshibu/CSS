<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 1px solid grey;
            width: 300px;
            /* padding: 40px; */
            /* margin: 50px auto; */
            border-radius: 13px;
            background-color: #eee;
            box-shadow: 2px 3px 6px grey;

        }

        input{
            width: 100%;
            padding: 10px;
            margin-bottom: 13px;
            border-radius: 8px;
            border: none;
            outline: none;

        }

        div:hover{
            box-shadow: 2px 2px 20px rgb(255, 125, 125);
        }

        button{
            
            padding-top: 7px;
            padding-bottom: 7px;
            padding-left: 20px;
            padding-right: 20px;
            margin-top: 15px;
            background-color: green;
            color: white;
            width: 100%;
            border: none;
            border-radius: 8px;
            font-size: 16px;

        }

        button:hover{
            background-color: black;
            cursor: pointer;
        }

        
    </style>
</head>
<body>
    <div>
        <h2>Login</h2>
        <input type="text" placeholder="Enter Your Name">
        <input type="text" placeholder="Enter Your Password">
       <button>Login</button>
    </div>
</body>
</html>
