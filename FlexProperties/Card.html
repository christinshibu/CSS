<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            text-align: center;
            margin-bottom: 12px;
            margin-top: 10px;
        }
        span {
            border-bottom: 1px solid blue;
        }

        section {
            background-color: #eee;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            /* justify-content: space-between; */
            gap: 20px;
            padding: 20px 80px;
        }

        .card {
            width: 250px;
            /* border: 2px solid red; */
            text-align: center;
            /* padding: 10px; */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0px 0px 5px rgb(177, 177, 177);
        }

        img {
            width: 100%;
            height: 250px;
        }
        h2{
            margin-bottom:12px;
        }
        p{
            margin-bottom: 10px;
            color: rgb(10, 122, 10);
            font-weight: bold;
        }
        button{
            width: 100%;
            padding: 8px 20px;
            background-color: blue;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            box-shadow: 0px 0px 4px rgb(191, 191, 191);
        }
        article{
            /* border: 2px solid blue; */
            padding: 10px;
        }
        button:hover{
            background-color: black;
            cursor: pointer;
        }
        nav{
            /* border: 2px solid red; */
            padding: 20px;
            background-color: #232f32;
            text-align: center;
        }
        nav a{
            color: black;
            font-size: 18px;
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Services</a>
        <a href="">Offers</a>
        <a href="">Sign-Out</a>
    </nav>
    <h1><span>Trending Products</span></h1>
    <section>
        <div class="card">
            <img src="./laptop.png" alt="">
            <article>
                <h2>Laptop</h2>
                <p>&#8377; 85,000</p>
                <button>Add to Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./iphone.png" alt="">
            <article>
                <h2>iPhone</h2>
                <p>&#8377; 99,000</p>
                <button>Add to Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./JoyStick.png" alt="">
            <article>
                <h2>Joy Stick</h2>
                <p>&#8377; 3,500</p>
                <button>Add to Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./remotecar.png" alt="">
            <article>
                <h2>Remote Car</h2>
                <p>&#8377; 15,500</p>
                <button>Add to Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./Play Station.png" alt="">
            <article>
                <h2>Play Station</h2>
                <p>&#8377; 1,55000</p>
                <button>Add to Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./VR Glass.png" alt="">
            <article>
                <h2>VR Glass</h2>
                <p>&#8377; 90,500</p>
                <button>Add to Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./watch.png" alt="">
            <article>
                <h2>Watch</h2>
                <p>&#8377; 5,000</p>
                <button>Add to Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./tab.png" alt="">
            <article>
                <h2>Tablet</h2>
                <p>&#8377; 90,500</p>
                <button>Add to Cart</button>
    </section>
</body>

</html>
