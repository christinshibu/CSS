<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        *{
            margin: 0;

            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        nav{
            border: 2px solid grey;
            padding: 25px;

            justify-content: space-between;

        }
        .logo{
            /* border: 2px solid red; */

        }

        .content{
            /* border: 2px solid blue; */
            display: flex;
            align-items: center;

            padding: 0 8px;

        }
        .content a{
            color: white;
            text-decoration: none;
        }
        .logo:hover{

        }

        .content a:hover{

        }

        section{
            /* border: 2px solid black; */
            height: 500px;
            
        }
        section h2{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500px;
            /* width: 250px; */
        }
    </style>
</head>
<body>

    <nav>

    <div class="logo">
