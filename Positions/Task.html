<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }
        .outer{

            background: url(./background.png);
            height: 600px ;
            width: 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            position: relative;
            
        }

        .inner{
            position: absolute;
            top:0;
            /* opacity: 75%;
            background-color: rgb(53, 53, 53); */
            height: 600px;
            width: 100%;
        }

        .middle{
            top:0;
            opacity: 75%;
            background-color: rgb(53, 53, 53);
            height: 600px;
            width: 100%;
            position: absolute;
        }

        h1{
            text-align: center;
            color: white;
            font-size: 70px;
            margin-top: 20px;
        }
        p{
            text-align: center;
            font-size: 37px;
            margin-top: 20px;
            margin-left: 45px;
            margin-right: 45px;
            color: white;
        }
        button{
            margin-left: 40%;
            margin-top: 40px;
            font-size: 25px;
            padding: 15px 20px;
            border-radius: 8px;
            border: none;
            background-color: white;
        }

    </style>
</head>
<body>
    <div class="outer"></div>
    <div class="middle"></div>
    <div class="inner">
        <h1>A New Perspective</h1>
        <p>Our innovative approach redefines industry standards, creating solutions that are both powerful and elegant</p>
        <button>Learn More About Us</button>
    </div>
</body>
</html>
