<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            height: 250px;
            width: 300px;
            background-color: pink;
            position: relative;
            top: 300px;
            left: 70px;
            /* margin-top: 300px; */

        }

        .child{
            height: 100px;
            width: 150px;
            background-color: cadetblue;
            position: absolute;
            top: 50px;
            /* left: 80px; */
            right: 0;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">
            Absolute position
        </div>

    </div>
</body>
</html>
