<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 2px solid red;
            height: 600px;
            width: 100%;
            background-image: url(./pvr.png);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            position: relative;
            margin: 50px auto;
                
        }

        .content {
            position: absolute;
            top: 30%;
            left: 25%;
            color:white;
            font-size: 35px;

        }

        button {
            padding: 10px 20px;
            margin-left: 40%;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div class="container"></div>
    <div class="content">
        <h1>Welcome to PVR Cinema's</h1>
        <button>Book Tickets</button>
    </div>
</body>

</html>
